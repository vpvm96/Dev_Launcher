<!-- 프로젝트 그룹과 환경 설정을 관리하는 데스크톱 런처 화면 -->
<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"><title>Dev Launcher</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="window-drag" aria-hidden="true"></div><aside class="sidebar"><div class="brand"><span class="brand-mark">&gt;_</span><div>Dev Launcher<small>YOUR LOCAL WORKSPACE</small></div></div><div class="section-label">PROJECT GROUPS</div><nav id="groups" aria-label="프로젝트 그룹"></nav><button id="add-group" class="add-group">＋ 그룹 추가</button><div class="sidebar-footer"><button id="updates">업데이트 확인</button><small id="update-summary" aria-live="polite"></small><button id="restart-app" title="실행 중인 서버를 종료하고 런처를 다시 엽니다.">앱 재시작</button><small>실행 중인 서버도 종료됩니다.</small><span class="dot running"></span> Local on this Mac<small>환경을 고르고, 한 번에 시작하세요.</small></div></aside>
<main><header><div><div class="eyebrow">WORKSPACE / LOCAL</div><div class="group-heading"><h1 id="group-title">프로젝트 불러오는 중…</h1><button id="rename-group" class="rename-button" aria-label="그룹 이름 변경">이름 변경</button></div><p id="group-description">프로젝트와 환경을 한곳에서 관리하세요.</p></div><button id="add-app">＋ 프로젝트 추가</button></header>
<section class="toolbar" aria-label="그룹 실행 도구"><div class="toolbar-left"><label for="group-mode">그룹 환경</label><select id="group-mode"><option value="dev">DEV</option><option value="prod">PROD</option></select><span class="divider"></span><span id="selection-count">0개 선택</span></div><div class="actions"><button id="stop-all">전체 종료</button><button id="start-selected" class="primary">▶ 선택 실행</button></div></section>
<label class="check-label auto-open"><input type="checkbox" id="auto-open" checked>실행 후 브라우저 열기<span>모든 그룹에 적용</span></label>
<div class="list-heading"><span>PROJECTS <span id="app-count" class="count">0</span></span><span id="running-count">0개 실행 중</span></div><section id="apps" class="app-list" aria-label="프로젝트 목록"></section><footer class="main-footer"><span>DEV / PROD는 로컬 실행에 적용할 환경 설정입니다.</span><span>설정을 바꾼 앱만 다시 시작하세요.</span></footer></main>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-header"><div><div id="modal-eyebrow" class="eyebrow">WORKSPACE SETTINGS</div><h2 id="modal-title"></h2></div><button id="close-modal" class="icon-button" aria-label="닫기">×</button></div><div id="modal-body"></div><div id="modal-actions" class="modal-actions"></div></dialog><div id="toast" role="status" aria-live="polite" hidden></div><script src="renderer.js"></script></body></html>
